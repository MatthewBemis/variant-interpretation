openapi: 3.0.3
info:
  title: Variant Interpretation Backend API
  description: API for the variant interpretation application.
  version: 0.1.0
servers:
  - url: /
paths:
  /api/hello:
    get:
      operationId: hello
      summary: Returns a greeting along with the current server time.
      tags:
        - hello
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
components:
  schemas:
    HelloResponse:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: string
          description: Current server time (ISO-8601 instant).
          example: "2026-07-28T19:20:05.415Z"
